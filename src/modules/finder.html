<!DOCTYPE html>
<html data-mod="finder" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>통증 원인 근육 찾기</title>
<style>
:root{--bg:#eef1f4;--paper:#fff;--ink:#172033;--muted:#5a6578;--line:#d5dbe3;--muscle:#b4233c;--nerve:#1f5fa8;--ok:#1d7a4b;--warn:#a15c00;--soft:#fbf3f2}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--paper:#171e29;--ink:#e7ebf1;--muted:#9aa5b5;--line:#2c3646;--muscle:#f06a7f;--nerve:#6ea8ec;--ok:#5fcf93;--warn:#f0b35a;--soft:#22191d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
header{padding:18px 20px 6px;max-width:1240px;margin:0 auto}
h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}
h1 span{color:var(--muscle)}
.lead{margin:.25em 0 0;color:var(--muted);font-size:.93rem}
main{max-width:1320px;margin:0 auto;padding:10px 20px 40px;display:grid;grid-template-columns:minmax(340px,540px) 1fr;gap:18px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.mapwrap{position:sticky;top:10px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button,.chip,.btn{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:transparent}
.seg #undo{margin-left:auto}.seg .btn:disabled{opacity:.45;cursor:default}
#mapbox{position:relative}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 8px 7px 14px;font-size:.85rem;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;z-index:5}
#toast[hidden]{display:none}#toast button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:3px 10px;background:var(--paper);color:var(--ink);cursor:pointer}
.hint.fix{font-size:.78rem}.hint.fix b{color:var(--ink)}
#map g.pinm{cursor:grab;touch-action:none}#map g.pinm.drag{cursor:grabbing}#map g.pinm.drag circle{stroke:#ffd84d;stroke-width:3}
.pin.flash{animation:fl .9s}@keyframes fl{0%{background:#ffe08a}100%{}}
#map{display:block;touch-action:manipulation;cursor:crosshair}
#map{display:grid;grid-template-columns:1fr 1fr;gap:6px}#map .bv{margin:0;min-width:0}#map figcaption{text-align:center;font-size:.85rem;margin-bottom:2px}#map figcaption small{color:var(--muted);font-size:.72rem;display:block}
#map svg{width:100%;height:auto;max-height:68vh;display:block;margin:0 auto}.segt{font-size:.85rem;color:var(--muted);align-self:center}.seg .btn{white-space:nowrap}@media (max-width:520px){.segt{display:none}}
.hint{font-size:.82rem;color:var(--muted);margin:.4em 0 .2em}
.pins{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;margin:.4em 0}
.pin{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--muscle);color:var(--ink);border-radius:999px;padding:3px 6px 3px 10px;font-size:.85rem}
.pin i{font-style:normal;background:var(--muscle);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700}
.pin button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px;line-height:1}
details.regs{margin-top:6px}
details.regs summary{cursor:pointer;font-size:.88rem;font-weight:600}
.reglist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.reglist .chip{padding:4px 10px;font-size:.82rem}
.reglist .rg{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px;width:100%}.reglist .rg>b{font-size:.8rem;margin-right:2px;color:var(--muted)}
.reglist .chip.on{background:var(--muscle);color:#fff;border-color:transparent}
.right h2{font-size:1.05rem;margin:.1em 0 .5em}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.empty b{display:block;font-size:2.2rem;line-height:1;margin-bottom:.3em}
.cands{display:grid;gap:10px}
.cand{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.cand:hover,.cand:focus-visible{border-color:var(--muscle)}
.cand.sel{border:2px solid var(--muscle);background:var(--soft)}
.rank{font-weight:800;font-size:1.1rem;color:var(--muscle);text-align:center}
.cand b{font-size:1rem}
.cand small{color:var(--muted);margin-left:6px}
.why{font-size:.82rem;color:var(--muted);margin-top:2px}
.lv{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.lv.h{background:var(--muscle);color:#fff}.lv.m{background:#f2c4cb;color:#5a0c1b}.lv.l{background:var(--line);color:var(--ink)}
.detail{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.dh h3{margin:0;font-size:1.2rem}
.dh small{color:var(--muted)}
.chs{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.chs a{font-size:.78rem;text-decoration:none;border:1px solid var(--nerve);color:var(--nerve);border-radius:999px;padding:2px 9px}
.dgrid{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:14px;margin-top:10px}
.figs{display:flex;gap:6px}
.figs figure{margin:0;flex:1;text-align:center}
.figs svg{width:100%;height:230px}
.figs figcaption{font-size:.75rem;color:var(--muted)}
.nofig{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:12px}
dl{margin:0}dt{font-weight:700;font-size:.85rem;color:var(--muscle);margin-top:.5em}dd{margin:.1em 0 0}
.media{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.media a{font-size:.88rem;color:var(--nerve);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.media a:hover{border-color:var(--nerve)}
.media a small.cc{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
.exs{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.exs h4{margin:0 0 8px;font-size:.98rem}
.exg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.exc.s{border-top:4px solid var(--ok)}.exc.r{border-top:4px solid var(--muscle)}
.exc .k{font-size:.78rem;font-weight:800;letter-spacing:.02em}.exc.s .k{color:var(--ok)}.exc.r .k{color:var(--muscle)}
.exc b{font-size:.95rem}.exc p{margin:0;font-size:.88rem;line-height:1.55}
.exc .dose{font-size:.82rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:4px 8px}
.exc .lk{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.exc .lk a{font-size:.84rem;color:var(--nerve);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:6px 9px;line-height:1.3}
.exc .lk a:hover{border-color:var(--nerve)}.exc .lk a.vf{border-color:var(--nerve);background:rgba(31,95,168,.05)}
.exc .lk a small{color:var(--muted)}
.exnote{font-size:.8rem;color:var(--muted);margin:8px 0 0;line-height:1.5}
@media (max-width:720px){.exg{grid-template-columns:1fr}}
.media a::before{content:"▶ ";font-size:.75em}
.media a.doc::before{content:"🖼 "}
.next{margin-top:12px;border:1px solid var(--nerve);border-radius:10px;padding:9px 12px;font-size:.86rem;background:color-mix(in srgb,var(--nerve) 6%,var(--paper))}.next b{color:var(--nerve)}.next ol{margin:.3em 0 0;padding-left:1.3em}.next a{color:var(--nerve);font-weight:700}
.warn{margin-top:12px;border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--paper));border-radius:8px;padding:9px 12px;font-size:.86rem}
.warn b{color:var(--warn)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:4px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend .lp::before{background:#1f5fa8}.legend .lr::before{background:#ff2d55}.legend .lt::before{background:#fff;border:2px solid #111;width:7px;height:7px}
@media (max-width:820px){main{grid-template-columns:1fr}.mapwrap{position:static}.dgrid{grid-template-columns:1fr}#map svg{max-height:56vh}}
</style>
</head>
<body>
<header>
<h1>통증 원인 근육 찾기 <span>· 연관통 지도</span></h1>
<p class="lead">아픈 곳을 인체도에서 누르면, 그 부위로 통증을 보낼 수 있는 근육(통증유발점)을 가능성 순으로 보여 줍니다. 최대 5곳까지 함께 고를 수 있습니다.</p>
</header>
<main>
<section class="panel mapwrap" aria-label="인체도">
  <div class="seg" role="group" aria-label="보기">
    <span class="segt">앞·뒤 인체도에서 아픈 곳을 누르세요</span>
    <button class="btn" id="undo" disabled title="마지막 작업 되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
    <button class="btn" id="reset">초기화</button>
  </div>
  <div id="mapbox"><div id="map"></div><div id="toast" role="status" aria-live="polite" hidden></div></div>
  <div class="legend"><span class="lp">선택한 통증 부위</span><span class="lr">후보 근육의 연관통</span><span class="lt">통증유발점</span></div>
  <p class="hint" id="sideHint">앞(왼쪽 그림)과 뒤(오른쪽 그림) 어디든 누를 수 있고, 두 면을 함께 골라도 됩니다.</p>
  <p class="hint fix"><b>잘못 눌렀다면</b> ↶ 되돌리기(Ctrl+Z) · 파란 점을 끌어 옮기기 · 파란 점을 한 번 더 누르면 지우기 · 아래 목록의 ×</p>
  <div class="pins" id="pins"></div>
  <details class="regs" open><summary>부위 이름으로 고르기</summary><div class="reglist" id="regs"></div></details>
</section>
<section class="panel right" aria-live="polite">
  <div id="out"></div>
</section>
</main>
<script>

    var p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);

    var c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=" C"+c1[0].toFixed(1)+" "+c1[1].toFixed(1)+" "+c2[0].toFixed(1)+" "+c2[1].toFixed(1)+" "+p2[0]+" "+p2[1];
  }
  return d+(closed?" Z":"");
}
/* 몸 외곽(왼쪽 절반, 위 중앙 → 아래 중앙) */
var OUT=[[150,80],[139,82],[136,95],[127,103],[112,109],[98,114],[82,124],[74,142],[71,170],[68,205],[64,245],[60,285],[57,320],[56,342],[52,365],[56,388],[66,392],[72,368],[76,345],[80,320],[86,282],[92,245],[96,205],[100,180],[102,215],[104,255],[100,290],[96,325],[96,360],[100,405],[104,445],[100,480],[104,520],[110,560],[104,580],[100,592],[132,594],[136,578],[136,540],[138,500],[136,455],[140,410],[144,370],[150,352]];

}
/* 근육: 왼쪽 절반 좌표. mid:true면 중앙선에 붙은 근육(대칭 합성) */
var M={back:{
  trapezius_u:{n:"위등세모근",p:[[150,76],[144,82],[138,94],[124,104],[106,112],[96,118],[106,126],[128,126],[150,124]],mid:1},
  trapezius_ml:{n:"중간·아래등세모근",p:[[150,122],[130,124],[112,126],[124,138],[136,160],[142,190],[150,236]],mid:1},
  levator:{n:"어깨올림근",p:[[141,84],[137,86],[126,110],[121,122],[127,124],[134,108],[143,90]]},
  deltoid:{n:"어깨세모근",p:[[106,116],[92,118],[80,128],[75,146],[78,168],[86,178],[94,160],[102,140],[110,126]]},
  infraspinatus:{n:"가시아래근",p:[[112,136],[138,140],[134,160],[126,186],[116,172],[108,150]]},
  latissimus:{n:"넓은등근",p:[[124,186],[142,192],[150,240],[150,292],[126,288],[106,272],[100,230],[100,198],[110,180]],mid:0},
  erector:{n:"척주세움근",p:[[150,170],[142,172],[138,220],[138,280],[140,322],[150,326]],mid:1},
  ql:{n:"허리네모근",p:[[132,268],[146,268],[146,302],[124,304],[120,290]]},
  tlf:{n:"등허리근막",p:[[150,262],[120,268],[110,290],[118,312],[150,318]],mid:1},
  gmed:{n:"중간볼기근",p:[[102,298],[130,294],[134,312],[122,326],[100,334],[97,316]]},
  gmax:{n:"큰볼기근",p:[[100,334],[124,322],[142,326],[150,334],[150,372],[132,382],[108,378],[98,356]]},
  piriformis:{n:"궁둥구멍근",p:[[146,330],[124,334],[104,340],[104,348],[124,344],[146,340]]},
  hamstrings:{n:"뒤넙다리근",p:[[106,378],[130,384],[144,376],[142,420],[138,450],[124,456],[112,450],[104,420]]},
  gastroc:{n:"장딴지근",p:[[106,460],[124,456],[140,462],[140,490],[134,520],[122,530],[110,520],[104,490]]},

  scm:{n:"목빗근",p:[[138,70],[142,72],[148,112],[144,114]]},
  trap_f:{n:"위등세모근",p:[[140,90],[136,98],[118,108],[106,114],[120,110],[140,100]]},
  pec:{n:"큰가슴근",p:[[150,118],[132,116],[110,120],[98,132],[104,150],[118,164],[150,166]],mid:1},
  deltoid:{n:"어깨세모근",p:[[112,116],[94,118],[80,128],[75,146],[78,168],[86,176],[96,158],[104,136]]},
  biceps:{n:"위팔두갈래근",p:[[80,170],[94,166],[96,190],[92,228],[84,240],[76,228],[74,200]]},
  forearm_f:{n:"아래팔 굽힘근",p:[[70,248],[90,250],[92,262],[86,300],[76,330],[64,326],[64,290]]},
  rectus:{n:"배곧은근",p:[[150,172],[134,172],[132,220],[134,270],[138,300],[150,304]],mid:1},
  oblique:{n:"배바깥빗근",p:[[132,172],[106,180],[100,220],[104,262],[118,286],[134,270],[132,220]]},
  iliopsoas:{n:"엉덩허리근",p:[[136,280],[124,300],[124,336],[132,348],[140,330],[142,296]]},
  quads:{n:"넙다리네갈래근",p:[[102,336],[124,344],[140,360],[140,410],[134,444],[120,452],[108,446],[100,410],[98,370]]},
  tib_ant:{n:"앞정강근",p:[[110,466],[122,464],[126,490],[122,540],[116,566],[110,560],[108,520],[106,490]]}
}};
function musclePath(m){
  if(m.mid){ var l=m.p, r=m.p.slice().reverse().map(mx); return smooth(l.concat(r.slice(1,-1)),true); }
  return smooth(m.p,true)+" "+smooth(m.p.map(mx),true);
}
var uid=0;
function body(o){
  o=o||{}; var view=o.view||"back", set=M[view], hl=o.hl||[], deep=o.deep||[], id="a"+(++uid);
  var vb=o.viewBox||"-90 0 480 605";

   '<linearGradient id="'+id+'sk" x1="0" x2="1"><stop offset="0" stop-color="#d9a98c"/><stop offset=".5" stop-color="#f1cfb7"/><stop offset="1" stop-color="#d4a083"/></linearGradient>'+
   '<radialGradient id="'+id+'mu" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e2475f"/><stop offset=".6" stop-color="#b4233c"/><stop offset="1" stop-color="#6e1022"/></radialGradient>'+
   '<radialGradient id="'+id+'md" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e9b3b0"/><stop offset="1" stop-color="#c98a88"/></radialGradient>'+
   '<pattern id="'+id+'fb" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate('+(o.fiber||70)+')"><line x1="0" y1="0" x2="0" y2="5" stroke="#000" stroke-opacity=".18" stroke-width="1"/></pattern>'+
   '<radialGradient id="'+id+'rf"><stop offset="0" stop-color="#ff2d55" stop-opacity=".75"/><stop offset=".55" stop-color="#ff2d55" stop-opacity=".35"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>'+
   '<filter id="'+id+'sh" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="2" dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
   '</defs>';
  if(o.flat!==false){
    var SK="#f8d69c", LN="#1d1d1d";
    s+='<g>';
    s+='<ellipse class="skin" cx="123.5" cy="52" rx="5" ry="8" fill="'+SK+'" stroke="'+LN+'" stroke-width="1.4"/><ellipse class="skin" cx="176.5" cy="52" rx="5" ry="8" fill="'+SK+'" stroke="'+LN+'" stroke-width="1.4"/>';

    s+='<ellipse class="skin" cx="150" cy="48" rx="27" ry="34" fill="'+SK+'" stroke="'+LN+'" stroke-width="1.6"/>';
    s+='</g>';
    if(view==="back"){ s+='<path d="M121 349 Q135 360 149 352 M151 352 Q165 360 179 349" fill="none" stroke="'+LN+'" stroke-width="1.3" stroke-linecap="round"/>'; }
    else { s+='<circle cx="150" cy="248" r="1.6" fill="'+LN+'" fill-opacity=".6"/>'; }
  } else {
  s+='<g filter="url(#'+id+'sh)"><ellipse class="skin" cx="150" cy="48" rx="27" ry="34" fill="url(#'+id+'sk)" stroke="#a87358" stroke-width="1"/>';
  s+='<path class="skin" d="'+outline()+'" fill="url(#'+id+'sk)" stroke="#a87358" stroke-width="1.2"/></g>';
  if(view==="back"){ s+='<path d="M150 90 V330" stroke="#a87358" stroke-opacity=".5" stroke-width="1"/>'; }

  }
  var keys=Object.keys(set);
  keys.forEach(function(k){
    if(k==="tlf") return;

    if(!on && o.dim===false) return;

  var figs=m.figs.length?'<div class="figs">'+m.figs.map(function(f){return '<figure>'+ANAT.body(f)+'<figcaption>'+(f.view==="back"?"뒤":"앞")+'</figcaption></figure>'}).join("")+'</div>':'<div class="nofig">'+esc(m.no||"도해 없음")+'</div>';
  var chs=m.ch.map(function(c){return '<a href="https://claude.ai/artifact/'+CHU[c]+'" target="_blank" rel="noopener">'+c+'장</a>'}).join("");
  var med='<a href="'+esc(m.t[0])+'" target="_blank" rel="noopener">통증유발점 영상'+(m.t[2]==="en"?'(영어 · 한국어 자막)':'')+': '+esc(m.t[2]==="en"?m.t[1].replace(/\s*\(영어\)\s*$/,""):m.t[1])+(m.t[2]==="en"?'<small class="cc">한국어 자막 켜기: 영상 아래 ⚙ 설정 → 자막 → 자동 번역 → 한국어 (모바일 앱은 ⋮ → 자막)</small>':'')+'</a>'+m.v.map(function(v,i){return '<a href="'+v[0]+'" target="_blank" rel="noopener">해부 영상 '+(i+1)+': '+esc(v[1])+'</a>'}).join("")+m.img.map(function(g){return '<a class="doc" href="'+g[0]+'" target="_blank" rel="noopener">그림: '+esc(g[1])+'</a>'}).join("");
  return '<div class="detail"><div class="dh"><h3>'+m.n+'</h3><small>'+esc(m.e)+' · '+esc(m.g)+'</small><div class="chs">'+(chs?'강의안 '+chs:'')+'</div></div>'+

   '<div class="dgrid">'+figs+'<div><dl><dt>통증유발점 위치</dt><dd>'+m.loc+'</dd><dt>연관통 부위</dt><dd>'+m.ref+'</dd></dl><div class="media">'+med+'</div></div></div>'+exHTML(m)+NEXT+'</div>';
}
function redflag(ps){
  var seen={},w="";
  ps.forEach(function(p){if(WARN[p.name]&&!seen[p.name]){seen[p.name]=1;w+='<div class="warn"><b>⚠ '+p.name+'</b> — '+WARN[p.name]+'</div>'}});
  return w;
}
$("reset").onclick=function(){ if(!pins.length) return; snapshot(); pins=[];sel=null;update(); toast("모두 지웠습니다.",true); };
$("undo").onclick=undo;
document.addEventListener("keydown",function(e){ var t=e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==="z"||e.key==="Z")){ e.preventDefault(); undo(); } });
update();
</script>
